<!--
  HTML Entry Point for React Application
  
  This is the main HTML file that:
  1. Defines the document structure and metadata
  2. Provides the root DOM element for React mounting
  3. Loads the React application entry point (main.tsx)
  
  Vite Development:
  - Vite serves this file and injects HMR (Hot Module Replacement) scripts
  - Changes to React components reload instantly
  
  Production Build:
  - Vite optimizes this HTML
  - React and dependencies are bundled into JavaScript
  - The root div is populated with the React app
  
  SEO and Social Media:
  - Meta tags for search engine optimization
  - Open Graph tags for social media sharing
  - Twitter Card tags for Twitter/X sharing
-->

<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />

		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<title>Learnato Forum - Discussion Platform for Learners</title>

		<meta
			name="description"
			content="Empower learning through conversation. Ask questions, share insights, and engage with the Learnato community."
		/>

		<meta
			name="keywords"
			content="learning forum, discussion platform, Q&A, education, knowledge sharing"
		/>

		<meta name="author" content="Learnato" />

		<meta
			property="og:title"
			content="Learnato Forum - Discussion Platform for Learners"
		/>
		<meta
			property="og:description"
			content="Empower learning through conversation. Join the Learnato community."
		/>
		<meta property="og:type" content="website" />
		<meta
			property="og:image"
			content="https://lovable.dev/opengraph-image-p98pqg.png"
		/>

		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Learnato Forum" />
		<meta
			name="twitter:description"
			content="Empower learning through conversation"
		/>
		<meta
			name="twitter:image"
			content="https://lovable.dev/opengraph-image-p98pqg.png"
		/>
	</head>

	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
